[project]
name = "ift6758"
version = "0.1.0"
description = "IFT6758 project: NHL play-by-play analysis"
readme = "README.md"
authors = [{ name = "David Qi" }]  # add your teammates here
requires-python = ">=3.10,<3.12"  # PandasAI requires Python < 3.12
dependencies = [
    "numpy",
    "pandas>=2.2",
    "matplotlib",
    "seaborn",
    "plotly",
    "requests",
    "tqdm",
    "lxml",
    "ipywidgets",
    "pandasai>=3.0.0",
]

[project.scripts]
download-nhl = "ift6758.data.nhl:main"

[project.optional-dependencies]
# Dependencies for running Qwen3-4B-Instruct-2507 (see ift6758/llm/qwen.py).
# Install with `uv sync --extra llm`. Keep notebooks/LLM setup.ipynb pinned to the same versions.
llm = [
    "accelerate>=1,<2",
    "bitsandbytes>=0.45,<1",
    "torch>=2.6",
    "transformers>=4.56",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "ipdb",
    "ruff",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
